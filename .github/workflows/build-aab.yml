name: Build Android App Bundle (AAB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-aab:
    name: Build Android App Bundle (.aab)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Generate Keystore for Signing
        run: |
          keytool -genkeypair -v \
            -keystore ./android.keystore \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass androidpassword \
            -keypass androidpassword \
            -dname "CN=Remap, OU=Mobile, O=Remap, L=City, S=State, C=US"

      - name: Build Android App Bundle (.aab)
        run: |
          bubblewrap build --skipPwaValidation --signingKeyPath=./android.keystore --signingKeyAlias=android --keyPassword=androidpassword --keyStorePassword=androidpassword

      - name: Upload Android App Bundle (.aab) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: remap-app-release-aab
          path: |
            *.aab
            app-release-bundle.aab
            app-release.aab
          if-no-files-found: warn
